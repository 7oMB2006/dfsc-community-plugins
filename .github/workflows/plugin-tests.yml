name: Validate selected plugin suites
on:
  workflow_dispatch:
    inputs:
      base:
        description: Full SHA of the earlier main commit to compare against
        required: true
        type: string
permissions:
  contents: read
jobs:
  plugin-tests:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node scripts/run-plugin-tests.mjs --base "$PLUGIN_TEST_BASE"
        shell: bash
        env:
          PLUGIN_TEST_BASE: ${{ inputs.base }}
